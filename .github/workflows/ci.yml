name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  dotnet:
    name: dotnet build + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Trackdub.Director.slnx -m:1
      - run: dotnet test Trackdub.Director.slnx -m:1 --no-build

  web:
    name: web build + test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
